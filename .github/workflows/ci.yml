name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (if available)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "docs" ]; then
            echo "Build failed: docs directory not found"
            exit 1
          fi
          echo "Build successful: docs directory exists"
