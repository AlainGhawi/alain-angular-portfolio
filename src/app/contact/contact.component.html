<section id="contact">
  <div class="container">

    <div appReveal>
      <p class="section-label">{{ 'CONTACT.LABEL' | translate }}</p>
      <h1 class="section-title">{{ 'CONTACT.TITLE' | translate }}</h1>
    </div>

    <div class="contact-grid">

      <!-- Form -->
      <div appReveal>
        <form [formGroup]="form" (submit)="send()" class="contact-form" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="name">{{ 'CONTACT.FULL_NAME' | translate }}</label>
              <input type="text" id="name" class="form-input" formControlName="from_name" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="email">{{ 'CONTACT.EMAIL' | translate }}</label>
              <input type="email" id="email" class="form-input" formControlName="from_email" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="subject">{{ 'CONTACT.SUBJECT' | translate }}</label>
            <input type="text" id="subject" class="form-input" formControlName="subject">
          </div>
          <div class="form-group">
            <label class="form-label" for="message">{{ 'CONTACT.MESSAGE' | translate }}</label>
            <textarea id="message" class="form-input form-textarea" formControlName="message" required></textarea>
          </div>
          <button type="submit" class="btn-primary submit-btn" [disabled]="!form.valid || isSubmitting">
            {{ (isSubmitting ? 'CONTACT.SENDING' : 'CONTACT.SEND_MESSAGE') | translate }}
          </button>
        </form>
      </div>

      <!-- Contact info -->
      <div class="contact-info" appReveal="delay-1">

        <div class="contact-info-item">
          <div class="info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.63A2 2 0 012.18 1h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.91 8.09a16 16 0 006 6l1.45-1.45a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 15v1.92z"/></svg>
          </div>
          <div>
            <p class="info-label">{{ 'CONTACT.PHONE' | translate }}</p>
            <a href="tel:+1-438-453-7830" class="info-value">+1 (438) 453-7830</a>
          </div>
        </div>

        <div class="contact-info-item">
          <div class="info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div>
            <p class="info-label">{{ 'CONTACT.EMAIL' | translate }}</p>
            <a href="mailto:ghawialain@gmail.com" class="info-value">ghawialain@gmail.com</a>
          </div>
        </div>

        <div class="contact-info-item">
          <div class="info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div>
            <p class="info-label">{{ 'CONTACT.LOCATION' | translate }}</p>
            <address class="info-value">Montreal, Canada</address>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
